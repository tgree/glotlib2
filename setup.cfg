[metadata]
name = glotlib2
version = 0.9.0
author = Terry Greeniaus
author_email = terry.greeniaus@gmail.com
description = Library for creating plots using OpenGL.
long_description = Library for creating plots using OpenGL.
long_description_content_type = text/x-rst
keywords = glotlib glotlib2
url = https://github.com/tgree/glotlib2
license = MPL-2.0
license_files = LICENSE
classifiers =
    Operating System :: OS Independent
    Programming Language :: Python :: 3
    License :: OSI Approved :: Mozilla Public License 2.0 (MPL 2.0)

[options]
python_requires = >=3.7
install_requires =
    freetype-py
    PyOpenGL
packages =
    glotlib2
    glotlib2.font_files
    glotlib2.pyside6
    glotlib2.shaders

[options.extras_require]
glfw = glfw
pyside6 = PySide6
all =
    glfw
    PySide6

[options.package_data]
glotlib2 =
    font_files/ttf_bitstream_vera_1_10/*
    shaders/*.frag
    shaders/*.vert
